<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="glow-o">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-x">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="350" fill="url(#bg2)"/>

  <!-- Board Container -->
  <rect x="180" y="55" width="240" height="240" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>

  <!-- Grid Lines -->
  <!-- Vertical 1 -->
  <line x1="260" y1="70" x2="260" y2="280" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <!-- Vertical 2 -->
  <line x1="340" y1="70" x2="340" y2="280" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <!-- Horizontal 1 -->
  <line x1="195" y1="135" x2="405" y2="135" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <!-- Horizontal 2 -->
  <line x1="195" y1="215" x2="405" y2="215" stroke="#475569" stroke-width="4" stroke-linecap="round"/>

  <!-- Marks -->
  <!-- Cell (0,0): O -->
  <circle cx="220" cy="95" r="22" stroke="#38bdf8" stroke-width="7" fill="none" filter="url(#glow-o)"/>

  <!-- Cell (1,1): X -->
  <g filter="url(#glow-x)">
    <line x1="282" y1="157" x2="318" y2="193" stroke="#f43f5e" stroke-width="7" stroke-linecap="round"/>
    <line x1="318" y1="157" x2="282" y2="193" stroke="#f43f5e" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Cell (0,2): X -->
  <g filter="url(#glow-x)">
    <line x1="202" y1="237" x2="238" y2="273" stroke="#f43f5e" stroke-width="7" stroke-linecap="round"/>
    <line x1="238" y1="237" x2="202" y2="273" stroke="#f43f5e" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Cell (2,0): O -->
  <circle cx="380" cy="95" r="22" stroke="#38bdf8" stroke-width="7" fill="none" filter="url(#glow-o)"/>

  <!-- Cell (1,0): O (Winning line) -->
  <circle cx="300" cy="95" r="22" stroke="#38bdf8" stroke-width="7" fill="none" filter="url(#glow-o)"/>

  <!-- Winning strike line -->
  <line x1="190" y1="95" x2="410" y2="95" stroke="#22c55e" stroke-width="5" stroke-linecap="round" opacity="0.9" filter="url(#glow-o)"/>

  <!-- Decorative sparkles -->
  <circle cx="130" cy="90" r="3" fill="#38bdf8" opacity="0.5"/>
  <circle cx="470" cy="240" r="4" fill="#f43f5e" opacity="0.6"/>
  <circle cx="450" cy="110" r="2" fill="#22c55e" opacity="0.7"/>
</svg>
